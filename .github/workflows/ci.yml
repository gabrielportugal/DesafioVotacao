name: Java CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: votacao_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Wait for PostgreSQL
      run: sleep 10  # Espera banco subir
    
    - name: Run tests (with fixes)
      run: |
        # Configura ambiente de teste
        export SPRING_PROFILES_ACTIVE=test
        export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/votacao_test
        
        # Executa testes SEM paralelismo
        mvn clean test -Dspring.profiles.active=test \
          -Dsurefire.parallel=classes \
          -Dsurefire.threadCount=1 \
          -Dspring.main.lazy-initialization=true
    
    - name: Build JAR
      if: success()  # Só executa se testes passarem
      run: mvn clean package -DskipTests