version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votacao-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: ["/wait-for-it.sh", "host.docker.internal:5432", "--", "java", "-jar", "app.jar"]
    volumes:
      - ./src:/app/src
      - ./wait-for-it.sh:/wait-for-it.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - votacao-net

networks:
  votacao-net:
    driver: bridge
